<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calculator">
        <div class="display" id="display"></div>
        <div class="buttons">
            <!-- Digits -->
            <button data-action="digit-7">7</button>
            <button data-action="digit-8">8</button>
            <button data-action="digit-9">9</button>
            <button data-action="operator-divide">/</button>

            <button data-action="digit-4">4</button>
            <button data-action="digit-5">5</button>
            <button data-action="digit-6">6</button>
            <button data-action="operator-multiply">*</button>

            <button data-action="digit-1">1</button>
            <button data-action="digit-2">2</button>
            <button data-action="digit-3">3</button>
            <button data-action="operator-subtract">-</button>

            <button data-action="digit-0">0</button>
            <button data-action="clear">C</button>
            <button data-action="delete">←</button>
            <button data-action="operator-add">+</button>

            <button data-action="equals" class="equals">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
